{{- include "tessera.validate" . -}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tessera.fullname" . }}
  labels: {{- include "tessera.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secret.databaseUrl | quote }}
  SECRET_KEY: {{ .Values.secret.secretKey | quote }}
  {{- with .Values.redis.url }}
  REDIS_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.metricsToken }}
  METRICS_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.bootstrap.adminPassword }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
